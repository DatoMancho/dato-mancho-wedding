<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>დათო & მანჩო</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fffaf7;
      font-family: Arial, sans-serif;
      color: #444;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      padding: 50px 30px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 52px;
      color: #c9a27e;
      margin-bottom: 10px;
    }

    .date {
      font-size: 28px;
      margin-bottom: 40px;
      color: #777;
    }

    .section {
      margin-top: 40px;
    }

    h2 {
      color: #b8895f;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      line-height: 1.8;
    }

    .footer {
      margin-top: 60px;
      font-size: 24px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>დათო & მანჩო</h1>

    <div class="date">
      30 აგვისტო, 2026
    </div>

    <div class="section">
      <h2>ხელის მოწერის ცერემონია</h2>
      <p>
        ლოკაცია: შუაგული <br>
        დრო: 12:00
      </p>
    </div>

    <div class="section">
      <h2>ჯვრის წერის ცერემონია</h2>
      <p>
        ლოკაცია: სვეტიცხოველი <br>
        დრო: 15:00
      </p>
    </div>

    <div class="section">
      <h2>წვეულება</h2>
      <p>
        ლოკაცია: ხაშური, რესტორანი ქალაქური <br>
        დრო: 19:00
      </p>
    </div>

    <div class="footer">
      სიყვარულით 🤍 დათო & მანჩო 🤍
    </div>

  </div>

</body>
</html>
