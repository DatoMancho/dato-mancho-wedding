<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>დათო & მანჩო</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow-x:hidden;
background:#f8f2ea;
font-family:'Cormorant Garamond',serif;
}

/* INTRO */

.intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#f8f2ea;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
animation:hideIntro 4s forwards;
animation-delay:3.5s;
}

@keyframes hideIntro{
to{
opacity:0;
visibility:hidden;
}
}

/* ENVELOPE */

.envelope{
width:320px;
height:220px;
position:relative;
animation:openEnvelope 3s ease forwards;
}

.envelope-body{
position:absolute;
width:100%;
height:100%;
background:#efe2cf;
border-radius:8px;
box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.flap{
position:absolute;
width:100%;
height:120px;
background:#e4d2bb;
clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;
animation:flapOpen 2.2s ease forwards;
}

@keyframes flapOpen{
100%{
transform:rotateX(180deg);
}
}

.card{
position:absolute;
left:20px;
right:20px;
top:30px;
bottom:20px;
background:white;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
color:#b9925d;
transform:translateY(0);
animation:cardRise 2.5s ease forwards;
}

@keyframes cardRise{
100%{
transform:translateY(-180px);
}
}

@keyframes openEnvelope{
100%{
transform:scale(0);
opacity:0;
}
}

/* HERO */

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),
url('photo.jpg');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
position:relative;
}

.hero-content{
animation:fadeUp 2s ease;
animation-delay:3.2s;
opacity:0;
animation-fill-mode:forwards;
}

@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
from{
opacity:0;
transform:translateY(40px);
}
}

.hero h1{
font-size:72px;
font-weight:300;
letter-spacing:3px;
}

.hero .date{
font-size:30px;
margin-top:10px;
}

/* GOLD PARTICLES */

.sparkle{
position:fixed;
width:8px;
height:8px;
border-radius:50%;
background:#ffd56a;
box-shadow:
0 0 10px #ffd56a,
0 0 20px #ffd56a;
pointer-events:none;
z-index:999;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh);
opacity:0;
}
}

/* CONTENT */

.content{
max-width:900px;
margin:auto;
padding:80px 20px;
}

.block{
background:white;
padding:35px;
border-radius:24px;
margin-bottom:25px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
text-align:center;
}

.block h2{
color:#b9925d;
font-size:34px;
margin-bottom:10px;
}

.block p{
font-size:24px;
color:#555;
line-height:1.8;
}

.footer{
text-align:center;
padding:40px;
font-size:30px;
color:#b9925d;
}

</style>
</head>

<body>

<div class="intro">

<div class="envelope">

<div class="envelope-body"></div>

<div class="flap"></div>

<div class="card">
დათო & მანჩო
</div>

</div>

</div>

<section class="hero">

<div class="hero-content">

<h1>დათო & მანჩო</h1>

<div class="date">
30 აგვისტო • 2026
</div>

</div>

</section>

<div class="content">

<div class="block">
<h2>ხელის მოწერის ცერემონია</h2>
<p>
შუაგული<br>
12:00
</p>
</div>

<div class="block">
<h2>ჯვრის წერის ცერემონია</h2>
<p>
სვეტიცხოველი<br>
15:00
</p>
</div>

<div class="block">
<h2>წვეულება</h2>
<p>
რესტორანი ქალაქური<br>
19:00
</p>
</div>

</div>

<div class="footer">
🤍 სიყვარულით 🤍
</div>

<script>

for(let i=0;i<220;i++){

let s=document.createElement('div');

s.className='sparkle';

s.style.left=Math.random()*100+'vw';

s.style.top='-20px';

s.style.animationDuration=(3+Math.random()*3)+'s';

s.style.animationDelay=(Math.random()*3)+'s';

document.body.appendChild(s);

setTimeout(()=>{
s.remove();
},7000);

}

</script>

</body>
</html>
